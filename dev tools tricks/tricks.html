<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Tools Tricks</title>
</head>

<body>
    <p>×Break×Down×</p>
    <script>
        const dogs = [{ name: 'Barry', age: 4 }, { name: "Quiny", age: 2 }, { name: "Clampy", age: 1 }];

        const p = document.querySelector('p');
        function makeGreen() {
            this.style.color = "#BADA55"
            this.style.fontSize = '50px';
        }
        p.addEventListener('click',makeGreen);

        //regular
        console.log("hello");

        // interpolated
        console.log("hello %s my old friend","darkness");

        // styled
        console.log("%cI am a fancy text","font-size=50px, background:red");

        // warning
        console.warn("OH NOOO");

        // error
        console.error("oh no");

        // info
        console.info("very impportant information!");

        // testing
        console.assert(1===2,"that's wrong");

        // clearing
        console.clear();

        // viewing DOM Elements
        console.log(p);
        console.dir(p);

        console.clear();

        // grouping thogether
        dogs.forEach(dog=>{
            console.groupCollapsed(`${dog.name}`);
            console.log(`This is ${dog.name}`);
            console.log(`${dog.age} years old`);
            console.groupEnd(`${dog.name}`);
        });

        // counting
        console.count("hi");
        console.count("bye");
        console.count("hi");
        console.count("hi");
        console.count("bye");
        console.count("bye");
        console.count("hi");
        console.count("bye");

        // timing
        console.time("fetching data");
        fetch("https://api.github.com/users/wesbos")
        .then(data=>data.json())
        .then(data=>{
            console.timeEnd("fetching data");
        })

        // table
        console.table(dogs);

    </script>

</body>

</html>
