<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> 
    <title>Document</title>
</head>
<body>
    <h1>Update CSS Variables with <span class="JS">JS</span></h1>
    <div class="controls">
        <label for="spacing">Spacing</label>
        <input type="range" id="spacing" name="spacing" min="0" max="200" data-sizing="px">
        <label for="blur">Blur</label>
        <input type="range" id="blur" name="blur" min="0" max="25 " data-sizing="px">
        <label for="color">Color</label>
        <input type="color" id="color" name="color">
    </div>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1tJnzCVHxtz7NShqSg1Cz80pzap4hywZnokx-fcViJw&s=10">
    <script src="variables.js"></script>
</body>
</html>
