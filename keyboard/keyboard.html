<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> 
    <title>Drums keyboard</title>
</head>
<body>
    <div class="keys">
        <div data-key="65" class="key">
            <kbd>A</kbd>
            <span class="sound">clap</span>
        </div>
        <div data-key="83" class="key">
            <kbd>S</kbd>
            <span class="sound">hihat</span>
        </div>
        <div data-key="68" class="key">
            <kbd>D</kbd>
            <span class="sound">kick</span>
        </div>
        <div data-key="70" class="key">
            <kbd>F</kbd>
            <span class="sound">openhat</span>
        </div>
        <div data-key="71" class="key">
            <kbd>G</kbd>
            <span class="sound">boom</span>
        </div>
        <div data-key="72" class="key">
            <kbd>H</kbd>
            <span class="sound">ride</span>
        </div>
        <div data-key="74" class="key">
            <kbd>J</kbd>
            <span class="sound">snare</span>
        </div>
        <div data-key="75" class="key">
            <kbd>K</kbd>
            <span class="sound">tom</span>
        </div>
        <div data-key="76" class="key">
            <kbd>L</kbd>
            <span class="sound">tink</span>
        </div>
    </div>
    <audio data-key="65" data-version="var1" src="sounds/_ ClapBB.wav"></audio>
    <audio data-key="83" data-version="var1" src="sounds/_ HiHatBB.wav"></audio>
    <audio data-key="68" data-version="var1" src="sounds/_ KickBB.wav"></audio>
    <audio data-key="70" data-version="var1" src="sounds/_ OpenHatBB.wav"></audio>
    <audio data-key="71" data-version="var1" src="sounds/_ BoomBB.wav"></audio>
    <audio data-key="72" data-version="var1" src="sounds/_ RideBB.wav"></audio>
    <audio data-key="74" data-version="var1" src="sounds/_ SnareBB.wav"></audio>
    <audio data-key="75" data-version="var1" src="sounds/_ TomBB.wav"></audio>
    <audio data-key="76" data-version="var1" src="sounds/_ TinkBB.wav"></audio>

    <audio data-key="65" data-version="var2" src="sounds/clap.wav"></audio>
    <audio data-key="83" data-version="var2" src="sounds/hihat.wav"></audio>
    <audio data-key="68" data-version="var2" src="sounds/kick.wav"></audio>
    <audio data-key="70" data-version="var2" src="sounds/openhat.wav"></audio>
    <audio data-key="71" data-version="var2" src="sounds/boom.wav"></audio>
    <audio data-key="72" data-version="var2" src="sounds/ride.wav"></audio>
    <audio data-key="74" data-version="var2" src="sounds/snare.wav"></audio>
    <audio data-key="75" data-version="var2" src="sounds/tom.wav"></audio>
    <audio data-key="76" data-version="var2" src="sounds/tink.wav"></audio>



<script>
    function playSound(e){
        const audio=document.querySelector(`audio[data-key="${e.keyCode}"][data-version="var1"]`); 
        const key=document.querySelector(`.key[data-key="${e.keyCode}"]`);
        console.log(key);
        if(!audio) return;
        audio.currentTime=0; //в начало ?
        audio.play();
        key.classList.add("playing");
    }
    function removeTransition(e){
        if (e.propertyName !=="transform") return;
        // console.log(this);
        this.classList.remove("playing");
    }
    window.addEventListener('keydown',playSound);
    const keys=document.querySelectorAll(".key");
    keys.forEach(key=>key.addEventListener("transitionend",removeTransition));

</script>
        

    
</body>
</html>
